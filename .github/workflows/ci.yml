name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.plan.outputs.all }}
      matrix: ${{ steps.plan.outputs.matrix }}
      run_docker: ${{ steps.plan.outputs.run_docker }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select CI plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            git diff --name-only "$BASE_SHA" HEAD || echo "__fail_closed__"
          else
            echo "__fail_closed__"
          fi | python3 scripts/ci/select-ci-plan.py --shard-selected

  test-leg:
    needs: [changes]
    if: ${{ needs.changes.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run test leg
        env:
          ALL_TESTS: ${{ needs.changes.outputs.all }}
          MATRIX: ${{ needs.changes.outputs.matrix }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          LEG: ${{ matrix.leg }}
        run: |
          if [ "$ALL_TESTS" = "true" ]; then
            shard_num="${LEG#shard-}"
            python3 scripts/ci/run-tests.py --leg "$LEG" --shard "${shard_num}/6" --workers 4 --report test-report.json
          else
            printf '%s\n' $SCOPE > "$RUNNER_TEMP/selected-tests.txt"
            case "$LEG" in
              selected-*)
                shard_num="${LEG#selected-}"
                shard_total="$(python3 -c 'import json, os; print(sum(1 for x in json.loads(os.environ["MATRIX"]) if isinstance(x, str) and x.startswith("selected-")))')"
                python3 scripts/ci/run-tests.py --leg "$LEG" --files-from "$RUNNER_TEMP/selected-tests.txt" --shard "${shard_num}/${shard_total}" --workers 4 --report test-report.json
                ;;
              *)
                python3 scripts/ci/run-tests.py --leg "$LEG" --files-from "$RUNNER_TEMP/selected-tests.txt" --workers 4 --report test-report.json
                ;;
            esac
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: test-report-${{ matrix.leg }}
          path: test-report.json
          if-no-files-found: warn

  test:
    needs: [changes, test-leg]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LEG_RESULT: ${{ needs.test-leg.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes job did not succeed ($CHANGES_RESULT)" >&2
            exit 1
          fi
          if [ "$LEG_RESULT" != "success" ] && [ "$LEG_RESULT" != "skipped" ]; then
            echo "test-leg job did not succeed ($LEG_RESULT)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.changes.outputs.matrix != '[]' }}
        with:
          pattern: test-report-*
          path: reports
      - name: Check test leg completeness
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
        run: |
          mkdir -p reports
          git ls-files -- 'tests/test_*.py' | python3 scripts/ci/check-test-legs.py --scope "$SCOPE" reports

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The synthetic merge commit of a pull request is not part of what lands.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan the tree and the history
        env:
          SCAN_DENY: ${{ secrets.SCAN_DENY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$SCAN_DENY" ]; then
            printf '%s\n' "$SCAN_DENY" > "$RUNNER_TEMP/deny.txt"
            export SCAN_DENY_FILE="$RUNNER_TEMP/deny.txt"
          fi
          python3 scripts/scan.py --tree .
          # Only what this change adds; published history on main cannot be rewritten.
          base="$BASE_SHA"
          case "$base" in ""|0000000000000000000000000000000000000000) base="HEAD~1" ;; esac
          python3 scripts/scan.py --history --range "$base..HEAD"

  docker-core:
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Skip docker-core tests when not needed
        if: ${{ needs.changes.outputs.run_docker != 'true' }}
        run: |
          echo "Skipping real docker tests (run_docker=${{ needs.changes.outputs.run_docker }})."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.run_docker == 'true' }}
      - name: Enable containerd image store for daemon BuildKit GHA cache
        if: ${{ needs.changes.outputs.run_docker == 'true' }}
        run: |
          if ! docker info -f '{{.DriverStatus}}' | grep -q 'containerd'; then
            sudo python3 -c 'import json, os; p = "/etc/docker/daemon.json"; os.makedirs(os.path.dirname(p), exist_ok=True); text = open(p).read().strip() if os.path.isfile(p) else ""; cfg = json.loads(text) if text else {}; cfg.setdefault("features", {})["containerd-snapshotter"] = True; open(p, "w").write(json.dumps(cfg, indent=2) + "\n")'
            sudo systemctl restart docker
          fi
      - name: Set up Docker Buildx
        id: buildx
        if: ${{ needs.changes.outputs.run_docker == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Warm engine image cache
        if: ${{ needs.changes.outputs.run_docker == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: image/Dockerfile
          load: true
          provenance: false
          tags: dev-container-engine:local
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine,ignore-error=true
      - name: Real docker tests (core)
        if: ${{ needs.changes.outputs.run_docker == 'true' }}
        env:
          DEV_CONTAINER_DOCKER_TESTS: "1"
          PYTHONPATH: tests/docker
        run: |
          python3 -m unittest -v \
            tests/docker/test_engine_container.py \
            tests/docker/test_compose_paths.py \
            tests/docker/test_overlay.py \
            tests/docker/test_volume_lifecycle.py

  docker-multi-toolbox:
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Skip docker-multi-toolbox tests when not needed
        if: ${{ needs.changes.outputs.run_docker != 'true' }}
        run: |
          echo "Skipping real docker tests (run_docker=${{ needs.changes.outputs.run_docker }})."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.run_docker == 'true' }}
      - name: Enable containerd image store for daemon BuildKit GHA cache
        if: ${{ needs.changes.outputs.run_docker == 'true' }}
        run: |
          if ! docker info -f '{{.DriverStatus}}' | grep -q 'containerd'; then
            sudo python3 -c 'import json, os; p = "/etc/docker/daemon.json"; os.makedirs(os.path.dirname(p), exist_ok=True); text = open(p).read().strip() if os.path.isfile(p) else ""; cfg = json.loads(text) if text else {}; cfg.setdefault("features", {})["containerd-snapshotter"] = True; open(p, "w").write(json.dumps(cfg, indent=2) + "\n")'
            sudo systemctl restart docker
          fi
      - name: Set up Docker Buildx
        id: buildx
        if: ${{ needs.changes.outputs.run_docker == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Warm engine image cache
        if: ${{ needs.changes.outputs.run_docker == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: image/Dockerfile
          load: true
          provenance: false
          tags: dev-container-engine:local
          cache-from: type=gha,scope=engine
      - name: Warm toolbox image cache
        if: ${{ needs.changes.outputs.run_docker == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: image/toolbox
          file: image/toolbox/Dockerfile
          load: true
          provenance: false
          tags: dev-container-toolbox:local
          cache-from: type=gha,scope=toolbox
          cache-to: type=gha,mode=max,scope=toolbox,ignore-error=true
      - name: Real docker tests (multi-repo and toolbox)
        if: ${{ needs.changes.outputs.run_docker == 'true' }}
        env:
          DEV_CONTAINER_DOCKER_TESTS: "1"
          PYTHONPATH: tests/docker
        run: |
          python3 -m unittest -v \
            tests/docker/test_multi_repo_docker.py \
            tests/docker/test_multi_repo_lifecycle.py \
            tests/docker/test_toolbox_docker.py
